spring:
  application:
    name: backend
  datasource:
    url: "${DB_URL:jdbc:postgresql://127.0.0.1:55432/museum}"
    username: "${DB_USER:museum}"
    password: "${DB_PASSWORD:museum-local-only}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

server:
  address: 127.0.0.1
  port: 8080
