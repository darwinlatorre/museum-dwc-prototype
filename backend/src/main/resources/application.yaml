spring:
  application:
    name: backend
  datasource:
    url: "${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

catalog:
  sync:
    enabled: true
    delay: 86400000
    initial-delay: 60000

server:
  address: "${SERVER_ADDRESS:127.0.0.1}"
  port: "${SERVER_PORT:8080}"
