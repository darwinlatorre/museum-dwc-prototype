name: universidad

services:
  museum-db:
    image: postgres:17
    networks:
      - app
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - museum_mvp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    networks:
      - app
    environment:
      - DB_HOST=museum-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?Set DB_NAME in .env}
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - CORS_ALLOWED_ORIGINS
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      museum-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'test "$$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --connect-timeout 2 --max-time 3 http://127.0.0.1:${SERVER_PORT:-8080}/api/catalog/status)" = 200'
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  frontend:
    build:
      context: ./frontend
    networks:
      - app
      - proxy
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-8081}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.museum.rule=Host(`${TRAEFIK_HOST:-localhost}`)"
      - "traefik.http.routers.museum.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.museum.service=museum"
      - "traefik.http.routers.museum.tls=true"
      - "traefik.http.routers.museum.tls.certresolver=le"
      - "traefik.http.services.museum.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    profiles: [local-traefik]
    command:
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${TRAEFIK_NETWORK:-proxy}
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=${TRAEFIK_ENTRYPOINT:-websecure}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.${TRAEFIK_ENTRYPOINT:-websecure}.address=:443
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL:-example@email.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certificates:/letsencrypt
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  app:
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

volumes:
  museum_mvp_data:
  certificates:
