name: universidad

services:
  museum-db:
    image: postgres:17
    networks:
      - app
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - museum_mvp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    networks:
      - app
    env_file:
      - .env
    environment:
      DB_HOST: museum-db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      museum-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'test "$$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --connect-timeout 2 --max-time 3 http://127.0.0.1:8080/api/catalog/status)" = 200'
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  frontend:
    build:
      context: ./frontend
    networks:
      - app
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-8081}:80"
    labels:
      - "traefik.http.services.museum.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app:

volumes:
  museum_mvp_data:
