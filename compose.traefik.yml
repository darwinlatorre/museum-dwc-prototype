# Shared external network: create it explicitly before using either Traefik mode.
# Add --profile local-traefik only when this project should run the proxy.
services:
  frontend:
    networks:
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.museum.rule=Host(`${TRAEFIK_HOST:-localhost}`)"
      - "traefik.http.routers.museum.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.museum.service=museum"

  traefik:
    image: traefik:v3.6
    profiles: [local-traefik]
    command:
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${TRAEFIK_NETWORK:-proxy}
      - --entrypoints.${TRAEFIK_ENTRYPOINT:-web}.address=:80
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Ping remains internal; neither API nor dashboard is published.

networks:
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true
